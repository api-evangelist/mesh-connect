    loaders:
      - "@meshconnect/uwc-core"
      - "@meshconnect/uwc-react"
      - "@meshconnect/uwc-injected-connector"
      - "@meshconnect/uwc-wallet-connect-connector"
      - "@meshconnect/uwc-ton-connector"
      - "@meshconnect/uwc-tron-connector"
notes: >-
