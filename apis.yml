aid: mesh-connect
name: Mesh Connect
description: >-
  Mesh (formerly Mesh Connect) is a global crypto payments network that lets
  businesses accept crypto payments from 300+ wallets and exchanges and settle
  in stablecoins or local currency through a single integration. The Mesh
  Integration API and embeddable Link SDK handle account connection, credential
  validation, MFA, portfolio and balance aggregation, and managed crypto
  transfers across exchanges and self-custody wallets. Mesh is backed by
  Paradigm and operates in the crypto-infrastructure sector.
