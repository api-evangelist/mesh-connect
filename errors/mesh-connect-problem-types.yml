integration_errors:
  # Symptom/cause/fix scenarios from the Common Errors reference (not HTTP codes).
  - name: SDK domain not authorized
    symptom: Authorization or CORS error on load.
    cause: Domain not in the Mesh allowlist.
  - name: SDK iframe blocked by CSP
    symptom: Blank grey box where the modal should appear.
    cause: CSP frame-src rejects *.meshconnect.com.
  - name: Tron transfers blocked by CSP
    symptom: RPC calls to Tron endpoints refused.
    cause: CSP connect-src missing Tron nodes.
  - name: Link token expired or already used
    symptom: Error on openLink().
    cause: Link token is 10-minute single-use.
  - name: Empty catalog / symbol mismatch
    symptom: No assets shown or toAddresses error.
    cause: Contract address passed instead of ticker symbol.
  - name: Webhook signature validation fails
    symptom: All signatures rejected.
    cause: HMAC computed over re-serialized JSON, not raw bytes.
  - name: Transfer stuck pending
    symptom: Succeeded webhook never arrives.
    cause: CEX delay (up to 24h), amount below minimum, or 2FA timeout.
  - name: Duplicate webhook deliveries
    symptom: Same event processed multiple times.
    cause: At-least-once delivery; retries on non-2xx response. Deduplicate on EventId.
